[workspace]
resolver = "3"
members = ["crates/datom-cli", "crates/datom-core","crates/datom-lang"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/datomhq/datom"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
reqwest = { version = "0.13", features = ["form"] }
wiremock = "0.6"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
url = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
] }
